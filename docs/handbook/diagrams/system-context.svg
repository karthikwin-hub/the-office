<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t1">
  <title id="t1">System context: people and outside services around the Cloudflare Worker and one Durable Object per office</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.4}
    .edge{fill:#F3F5F7;stroke:#B4BCC6;stroke-width:1.4;stroke-dasharray:6 5}
    .key{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .t{font-size:15px;fill:#2A2D31;font-weight:600}
    .s{font-size:12.5px;fill:#5A6270}
    .lab{font-size:12px;fill:#27408B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a1)}
  </style>
  <rect class="box" x="20" y="40" width="190" height="64" rx="4"/><text class="t" x="36" y="66">Owner</text><text class="s" x="36" y="88">browser, phone, WhatsApp</text>
  <rect class="box" x="20" y="130" width="190" height="64" rx="4"/><text class="t" x="36" y="156">Accountant</text><text class="s" x="36" y="178">browser, read-only seat</text>
  <rect class="box" x="20" y="220" width="190" height="64" rx="4"/><text class="t" x="36" y="246">Suppliers, customers</text><text class="s" x="36" y="268">email bills and invoices</text>
  <rect class="box" x="20" y="310" width="190" height="80" rx="4"/><text class="t" x="36" y="336">Meta, LinkedIn, X</text><text class="s" x="36" y="358">posts, comments, webhooks,</text><text class="s" x="36" y="376">WhatsApp Cloud API</text>
  <rect class="box" x="20" y="416" width="190" height="64" rx="4"/><text class="t" x="36" y="442">Operator</text><text class="s" x="36" y="464">admin tool via wrangler</text>

  <rect class="edge" x="270" y="20" width="670" height="480" rx="6"/>
  <text class="lab" x="290" y="44">Cloudflare (one account, global edge)</text>

  <rect class="key" x="300" y="70" width="250" height="150" rx="4"/>
  <text class="t" x="316" y="96">Worker (Hono)</text>
  <text class="s" x="316" y="120">static web app (React)</text>
  <text class="s" x="316" y="140">sign-in (better-auth)</text>
  <text class="s" x="316" y="160">membership check, routing</text>
  <text class="s" x="316" y="180">webhooks, email in, cron</text>
  <text class="s" x="316" y="200">/api/o/:officeId/*</text>

  <rect class="key" x="640" y="70" width="270" height="150" rx="4"/>
  <text class="t" x="656" y="96">Office (Durable Object)</text>
  <text class="s" x="656" y="120">one per business, sole writer</text>
  <text class="s" x="656" y="140">books, staged changes, log</text>
  <text class="s" x="656" y="160">agents and engine (tax, ageing)</text>
  <text class="s" x="656" y="180">alarms: digest, publishing</text>
  <text class="s" x="656" y="200">WebSocket live updates</text>

  <rect class="box" x="300" y="290" width="160" height="70" rx="4"/><text class="t" x="316" y="316">D1</text><text class="s" x="316" y="338">accounts, offices, routes</text>
  <rect class="box" x="480" y="290" width="140" height="70" rx="4"/><text class="t" x="496" y="316">R2</text><text class="s" x="496" y="338">o/&lt;officeId&gt;/ files</text>
  <rect class="box" x="640" y="290" width="130" height="70" rx="4"/><text class="t" x="656" y="316">Workers AI</text><text class="s" x="656" y="338">open-weight models</text>
  <rect class="box" x="790" y="290" width="120" height="70" rx="4"/><text class="t" x="806" y="316">Email</text><text class="s" x="806" y="338">routing and send</text>

  <rect class="box" x="300" y="400" width="610" height="70" rx="4"/>
  <text class="t" x="316" y="426">Secrets</text>
  <text class="s" x="316" y="448">Worker secrets (auth, token key, platform keys) put from Infisical; never in files</text>

  <path class="ln" d="M210 72H300"/>
  <path class="ln" d="M210 162H300"/>
  <path class="ln" d="M210 252H255V200H300"/>
  <path class="ln" d="M210 350H262V180H300"/>
  <path class="ln" d="M210 448H280V340H300"/>
  <path class="ln" d="M550 145H640"/>
  <text class="lab" x="562" y="137">caller + office</text>
  <path class="ln" d="M380 220V290"/>
  <path class="ln" d="M700 220V290"/>
  <path class="ln" d="M660 220L590 290"/>
  <path class="ln" d="M850 220V290"/>
</svg>
