<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t3">
  <title id="t3">Inbound routing: email, social webhooks, OAuth callbacks and the shared WhatsApp number each resolve to one office</title>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.4}
    .key{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .t{font-size:14.5px;fill:#2A2D31;font-weight:600}
    .s{font-size:12px;fill:#5A6270}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a3)}
  </style>
  <rect class="box" x="10" y="20" width="250" height="70" rx="4"/><text class="t" x="24" y="46">Email to slug@INGEST_DOMAIN</text><text class="s" x="24" y="68">Email Routing catch-all to Worker</text>
  <rect class="box" x="10" y="110" width="250" height="70" rx="4"/><text class="t" x="24" y="136">Meta webhook (signed)</text><text class="s" x="24" y="158">one delivery, many entries</text>
  <rect class="box" x="10" y="200" width="250" height="70" rx="4"/><text class="t" x="24" y="226">OAuth callback</text><text class="s" x="24" y="248">signed state names office and owner</text>
  <rect class="box" x="10" y="290" width="250" height="90" rx="4"/><text class="t" x="24" y="316">Shared WhatsApp number</text><text class="s" x="24" y="338">one number for every office;</text><text class="s" x="24" y="356">sender's phone identifies the person</text>

  <rect class="key" x="330" y="20" width="270" height="70" rx="4"/><text class="t" x="344" y="46">route (kind = email)</text><text class="s" x="344" y="68">unknown address: rejected</text>
  <rect class="key" x="330" y="110" width="270" height="70" rx="4"/><text class="t" x="344" y="136">route by entry id</text><text class="s" x="344" y="158">page, Instagram, Threads, own WhatsApp</text>
  <rect class="key" x="330" y="200" width="270" height="70" rx="4"/><text class="t" x="344" y="226">state.office + owner check</text><text class="s" x="344" y="248">tokens sealed with that office's key</text>
  <rect class="key" x="330" y="290" width="270" height="90" rx="4"/><text class="t" x="344" y="316">wa_link: phone to person</text><text class="s" x="344" y="338">JOIN code links a phone; the active</text><text class="s" x="344" y="356">office or a numbered choice picks one</text>

  <rect class="box" x="680" y="150" width="260" height="120" rx="4"/>
  <text class="t" x="696" y="180">Exactly one office</text>
  <text class="s" x="696" y="204">/internal/email</text>
  <text class="s" x="696" y="222">/internal/social/meta</text>
  <text class="s" x="696" y="240">/internal/whatsapp</text>
  <text class="s" x="696" y="258">or nothing, if unrouted</text>

  <path class="ln" d="M260 55H330"/><path class="ln" d="M260 145H330"/><path class="ln" d="M260 235H330"/><path class="ln" d="M260 335H330"/>
  <path class="ln" d="M600 55C650 55 640 170 680 180"/>
  <path class="ln" d="M600 145C640 145 650 195 680 200"/>
  <path class="ln" d="M600 235H680"/>
  <path class="ln" d="M600 335C650 335 650 260 680 255"/>
</svg>
