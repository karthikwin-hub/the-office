<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" role="img" aria-labelledby="t-marketplace-manager">
  <title id="t-marketplace-manager">The Marketplace Manager: reads the sales and payout reports the marketplaces send into sales by channel, product, state and city, asking you once about a new layout</title>
  <defs><marker id="a-marketplace-manager" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-marketplace-manager)}
  </style>
  <text class="hd" x="15" y="50">WHAT STARTS IT</text><text class="hd" x="215" y="50">WHAT IT DOES</text><text class="hd" x="525" y="50">ON YOUR DESK</text><text class="hd" x="760" y="50">WHAT HAPPENS NEXT</text><rect class="tag-works" x="842" y="10" width="106" height="24" rx="12"/><text class="tg" x="895" y="26" text-anchor="middle">Works today</text>
  <path class="ln" d="M185 86H200V86H213"/><path class="ln" d="M185 223H200V86H213"/><path class="ln" d="M185 312H200V86H213"/><path class="ln" d="M243 117V131"/><path class="ln" d="M383 236V250"/><path class="ln" d="M243 236V337"/><path class="ln" d="M495 276H510V86H523"/><path class="ln" d="M730 86H745V86H758"/><path class="ln" d="M730 86H745V207H758"/><path class="ln" d="M495 363H510V196H745V280H758"/>
  <rect class="box" x="15" y="62" width="170" height="119" rx="4"/><text class="t" x="27" y="85">Email</text><text class="s" x="27" y="102">To the office's</text><text class="s" x="27" y="118">.sales address, from</text><text class="s" x="27" y="134">your people or the</text><text class="s" x="27" y="150">platforms; anything</text><text class="s" x="27" y="166">else is set aside</text>
  <rect class="box" x="15" y="199" width="170" height="71" rx="4"/><text class="t" x="27" y="222">Upload</text><text class="s" x="27" y="239">In its room: CSV,</text><text class="s" x="27" y="255">XLSX or zip</text>
  <rect class="box" x="15" y="288" width="170" height="71" rx="4"/><text class="t" x="27" y="311">WhatsApp</text><text class="s" x="27" y="328">A spreadsheet sent to</text><text class="s" x="27" y="344">the office</text>
  <rect class="stop" x="215" y="62" width="280" height="55" rx="4"/><text class="t" x="227" y="85">Same file as before?</text><text class="s" x="227" y="102">Set aside; nothing counted twice</text>
  <rect class="box" x="215" y="133" width="280" height="103" rx="4"/><text class="t" x="227" y="156">1. Recognises the report</text><text class="s" x="227" y="173">Amazon tax, transaction and</text><text class="s" x="227" y="189">settlement reports; Flipkart; Meesho;</text><text class="s" x="227" y="205">Myntra's P&amp;L; or a layout you</text><text class="s" x="227" y="221">confirmed before</text>
  <rect class="stop" x="271" y="252" width="224" height="71" rx="4"/><text class="t" x="283" y="275">A layout it has not seen?</text><text class="s" x="283" y="292">It guesses the columns and</text><text class="s" x="283" y="308">asks you once</text>
  <rect class="box" x="215" y="339" width="280" height="119" rx="4"/><text class="t" x="227" y="362">2. Reads every row</text><text class="s" x="227" y="379">Into sales and returns by channel,</text><text class="s" x="227" y="395">product, state and city; fees, TCS,</text><text class="s" x="227" y="411">TDS and transfers into payouts. A row</text><text class="s" x="227" y="427">it cannot read is listed, never</text><text class="s" x="227" y="443">guessed.</text>
  <rect class="desk" x="525" y="62" width="205" height="120" rx="4"/><text class="t" x="537" y="85">"Read &lt;file&gt; as</text><text class="t" x="537" y="102">&lt;platform&gt; sales"</text><text class="s" x="537" y="119">Always waits for you.</text><text class="s" x="537" y="135">Choose the date, order,</text><text class="s" x="537" y="151">quantity and amount</text><text class="s" x="537" y="167">columns.</text>
  <rect class="done" x="760" y="62" width="185" height="103" rx="4"/><text class="t" x="772" y="85">Read it this way</text><text class="s" x="772" y="102">The file is read, and</text><text class="s" x="772" y="118">every file in that</text><text class="s" x="772" y="134">layout after it,</text><text class="s" x="772" y="150">without asking</text>
  <rect class="stop" x="760" y="183" width="185" height="55" rx="4"/><text class="t" x="772" y="206">Reject</text><text class="s" x="772" y="223">The file is not read</text>
  <rect class="done" x="760" y="256" width="185" height="152" rx="4"/><text class="t" x="772" y="279">Online sales and</text><text class="t" x="772" y="296">payouts</text><text class="s" x="772" y="313">In the Boardroom; each</text><text class="s" x="772" y="329">morning, the last day's</text><text class="s" x="772" y="345">sales and any product</text><text class="s" x="772" y="361">whose returns are</text><text class="s" x="772" y="377">climbing go in the</text><text class="s" x="772" y="393">digest</text>
  <rect class="nyet" x="15" y="484" width="930" height="36" rx="4"/><text class="ny" x="27" y="506">Not yet: posting online sales to the books with GST; matching payouts to the bank.</text>
</svg>
