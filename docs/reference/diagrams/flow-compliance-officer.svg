<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" role="img" aria-labelledby="t-compliance-officer">
  <title id="t-compliance-officer">The Compliance Officer: keeps the company's filing calendar from its profile, reminds whoever files each item, and proposes actions from the books</title>
  <defs><marker id="a-compliance-officer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-compliance-officer)}
  </style>
  <text class="hd" x="15" y="50">WHAT STARTS IT</text><text class="hd" x="215" y="50">WHAT IT DOES</text><text class="hd" x="525" y="50">ON YOUR DESK</text><text class="hd" x="760" y="50">WHAT HAPPENS NEXT</text><rect class="tag-works" x="842" y="10" width="106" height="24" rx="12"/><text class="tg" x="895" y="26" text-anchor="middle">Works today</text>
  <path class="ln" d="M185 86H200V86H213"/><path class="ln" d="M185 192H200V86H213"/><path class="ln" d="M185 281H200V86H213"/><path class="ln" d="M243 133V147"/><path class="ln" d="M243 236V250"/><path class="ln" d="M495 276H510V86H523"/><path class="ln" d="M730 86H745V86H758"/><path class="ln" d="M495 173H510V197H745V159H758"/><path class="ln" d="M495 173H510V197H745V264H758"/>
  <rect class="box" x="15" y="62" width="170" height="88" rx="4"/><text class="t" x="27" y="85">Your company's</text><text class="t" x="27" y="102">profile</text><text class="s" x="27" y="119">Type, registrations,</text><text class="s" x="27" y="135">directors, events</text>
  <rect class="box" x="15" y="168" width="170" height="71" rx="4"/><text class="t" x="27" y="191">Filing proofs</text><text class="s" x="27" y="208">Uploaded, with the</text><text class="s" x="27" y="224">SRN</text>
  <rect class="box" x="15" y="257" width="170" height="103" rx="4"/><text class="t" x="27" y="280">The morning round</text><text class="s" x="27" y="297">Every morning at the</text><text class="s" x="27" y="313">digest time, 08:45</text><text class="s" x="27" y="329">unless you change it</text><text class="s" x="27" y="345">in Settings</text>
  <rect class="box" x="215" y="62" width="280" height="71" rx="4"/><text class="t" x="227" y="85">1. Builds the calendar</text><text class="s" x="227" y="102">GST, TDS, PF and ESI, ROC and income</text><text class="s" x="227" y="118">tax dates for this company</text>
  <rect class="box" x="215" y="149" width="280" height="87" rx="4"/><text class="t" x="227" y="172">2. Reminds</text><text class="s" x="227" y="189">7 days and 2 days before, on the day,</text><text class="s" x="227" y="205">then weekly while late, naming who</text><text class="s" x="227" y="221">files: you, or your CA or CS</text>
  <rect class="box" x="215" y="252" width="280" height="71" rx="4"/><text class="t" x="227" y="275">3. Checks the books</text><text class="s" x="227" y="292">MSME suppliers to be paid within 45</text><text class="s" x="227" y="308">days; advance tax to set aside</text>
  <rect class="desk" x="525" y="62" width="205" height="121" rx="4"/><text class="t" x="537" y="85">"Pay MSME suppliers</text><text class="t" x="537" y="102">first" / "Set aside</text><text class="t" x="537" y="119">advance tax"</text><text class="s" x="537" y="136">Always waits for you;</text><text class="s" x="537" y="152">comes back next month if</text><text class="s" x="537" y="168">rejected</text>
  <rect class="done" x="760" y="62" width="185" height="55" rx="4"/><text class="t" x="772" y="85">Approve</text><text class="s" x="772" y="102">Recorded in the log</text>
  <rect class="done" x="760" y="135" width="185" height="87" rx="4"/><text class="t" x="772" y="158">Working papers</text><text class="s" x="772" y="175">The filing pack to</text><text class="s" x="772" y="191">download; mark filed,</text><text class="s" x="772" y="207">assign or snooze</text>
  <rect class="done" x="760" y="240" width="185" height="71" rx="4"/><text class="t" x="772" y="263">The digest</text><text class="s" x="772" y="280">What is due and who</text><text class="s" x="772" y="296">files it</text>
  <rect class="nyet" x="15" y="386" width="930" height="36" rx="4"/><text class="ny" x="27" y="408">Not yet: the cash plan acting on an approved proposal; Desk cards for ROC events.</text>
</svg>
