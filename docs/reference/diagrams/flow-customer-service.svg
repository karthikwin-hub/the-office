<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" aria-labelledby="t-customer-service">
  <title id="t-customer-service">Customer Service: answers your customers on WhatsApp, email and website chat from your own answers and records, and hands anything sensitive to you</title>
  <defs><marker id="a-customer-service" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-customer-service)}
  </style>
  <text class="hd" x="15" y="50">WHAT STARTS IT</text><text class="hd" x="215" y="50">WHAT IT DOES</text><text class="hd" x="525" y="50">ON YOUR DESK</text><text class="hd" x="760" y="50">WHAT HAPPENS NEXT</text><rect class="tag-works" x="842" y="10" width="106" height="24" rx="12"/><text class="tg" x="895" y="26" text-anchor="middle">Works today</text>
  <path class="ln" d="M185 86H200V86H213"/><path class="ln" d="M185 192H200V86H213"/><path class="ln" d="M185 281H200V86H213"/><path class="ln" d="M185 354H200V86H213"/><path class="ln" d="M243 149V163"/><path class="ln" d="M383 236V250"/><path class="ln" d="M243 236V385"/><path class="ln" d="M495 411H510V86H523"/><path class="ln" d="M495 276H510V224H523"/><path class="ln" d="M730 86H745V86H758"/><path class="ln" d="M730 224H745V191H758"/><path class="ln" d="M730 224H745V296H758"/>
  <rect class="box" x="15" y="62" width="170" height="88" rx="4"/><text class="t" x="27" y="85">Your business</text><text class="t" x="27" y="102">WhatsApp</text><text class="s" x="27" y="119">Customers write to</text><text class="s" x="27" y="135">your own number</text>
  <rect class="box" x="15" y="168" width="170" height="71" rx="4"/><text class="t" x="27" y="191">Email</text><text class="s" x="27" y="208">To the office's .help</text><text class="s" x="27" y="224">address</text>
  <rect class="box" x="15" y="257" width="170" height="55" rx="4"/><text class="t" x="27" y="280">Website chat</text><text class="s" x="27" y="297">When you switch it on</text>
  <rect class="box" x="15" y="330" width="170" height="71" rx="4"/><text class="t" x="27" y="353">The morning round</text><text class="s" x="27" y="370">Chases customers</text><text class="s" x="27" y="386">still waiting</text>
  <rect class="box" x="215" y="62" width="280" height="87" rx="4"/><text class="t" x="227" y="85">1. Knows the customer</text><text class="s" x="227" y="102">By their number or email; on the</text><text class="s" x="227" y="118">website by an order number and phone</text><text class="s" x="227" y="134">or email</text>
  <rect class="box" x="215" y="165" width="280" height="71" rx="4"/><text class="t" x="227" y="188">2. Understands the message</text><text class="s" x="227" y="205">Rules first; the AI model only when</text><text class="s" x="227" y="221">the rules are unsure (150 a day)</text>
  <rect class="stop" x="271" y="252" width="224" height="119" rx="4"/><text class="t" x="283" y="275">Sensitive or unsure?</text><text class="s" x="283" y="292">Refunds, complaints, legal</text><text class="s" x="283" y="308">threats, anger, price talk,</text><text class="s" x="283" y="324">cancellations, asking for a</text><text class="s" x="283" y="340">person, or low confidence:</text><text class="s" x="283" y="356">handed to you</text>
  <rect class="box" x="215" y="387" width="280" height="103" rx="4"/><text class="t" x="227" y="410">3. Otherwise answers</text><text class="s" x="227" y="427">From your saved answers, business</text><text class="s" x="227" y="443">facts, order status or the customer's</text><text class="s" x="227" y="459">balance. The first reply says it is</text><text class="s" x="227" y="475">an AI and how to reach you.</text>
  <rect class="desk" x="525" y="62" width="205" height="120" rx="4"/><text class="t" x="537" y="85">"Reply to &lt;name&gt; on</text><text class="t" x="537" y="102">&lt;channel&gt;"</text><text class="s" x="537" y="119">While it is a Trainee, and</text><text class="s" x="537" y="135">when a Trusted agent</text><text class="s" x="537" y="151">answers from business</text><text class="s" x="537" y="167">facts</text>
  <rect class="desk" x="525" y="200" width="205" height="104" rx="4"/><text class="t" x="537" y="223">"&lt;name&gt; on &lt;channel&gt;</text><text class="t" x="537" y="240">wants …"</text><text class="s" x="537" y="257">A hand-off: always waits</text><text class="s" x="537" y="273">for you. The customer is</text><text class="s" x="537" y="289">told someone will reply.</text>
  <rect class="done" x="760" y="62" width="185" height="87" rx="4"/><text class="t" x="772" y="85">Approve</text><text class="s" x="772" y="102">The reply goes to the</text><text class="s" x="772" y="118">customer, as written or</text><text class="s" x="772" y="134">as you edited it</text>
  <rect class="done" x="760" y="167" width="185" height="87" rx="4"/><text class="t" x="772" y="190">Answer a hand-off</text><text class="s" x="772" y="207">Your reply is sent, and</text><text class="s" x="772" y="223">can be saved as a new</text><text class="s" x="772" y="239">answer for next time</text>
  <rect class="stop" x="760" y="272" width="185" height="71" rx="4"/><text class="t" x="772" y="295">Reject</text><text class="s" x="772" y="312">Nothing is sent; a</text><text class="s" x="772" y="328">hand-off is closed</text>
  
</svg>
