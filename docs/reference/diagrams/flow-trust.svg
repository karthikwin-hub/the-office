<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 407" role="img" aria-labelledby="t-trust">
  <title id="t-trust">Trust levels: every agent starts as a Trainee, you can promote it to Trusted and then Autonomous when its record allows, and some work always waits for you</title>
  <defs><marker id="a-trust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-trust)}
  </style>
  <text class="hd" x="10" y="28">TRAINEE</text><text class="hd" x="245" y="28">TRUSTED</text><text class="hd" x="520" y="28">AUTONOMOUS</text><text class="hd" x="740" y="28">ALWAYS WAITS FOR YOU</text>
  <path class="ln" d="M38 176V192"/><path class="ln" d="M215 218H230V64H243"/><path class="ln" d="M273 304V320"/><path class="ln" d="M490 346H505V64H518"/>
  <rect class="box" x="10" y="40" width="205" height="136" rx="4"/><text class="t" x="22" y="63">Every card waits for</text><text class="t" x="22" y="80">you</text><text class="s" x="22" y="97">Each agent starts here.</text><text class="s" x="22" y="113">Every decision you make is</text><text class="s" x="22" y="129">counted; an approval</text><text class="s" x="22" y="145">without changes counts as</text><text class="s" x="22" y="161">correct.</text>
  <rect class="none" x="10" y="194" width="205" height="119" rx="4"/><text class="t" x="22" y="217">Promotion offered</text><text class="s" x="22" y="234">After 50 decisions with</text><text class="s" x="22" y="250">97% approved unchanged.</text><text class="s" x="22" y="266">Nothing promotes itself:</text><text class="s" x="22" y="282">you choose the level in</text><text class="s" x="22" y="298">the agent's room.</text>
  <rect class="box" x="245" y="40" width="245" height="264" rx="4"/><text class="t" x="257" y="63">Routine work goes ahead</text><text class="t" x="257" y="80">alone</text><text class="s" x="257" y="97">• A bill or invoice from a party</text><text class="s" x="257" y="113">already in your books, every</text><text class="s" x="257" y="129">check passed, under ₹1 lakh</text><text class="s" x="257" y="145">• A polite first payment</text><text class="s" x="257" y="161">reminder</text><text class="s" x="257" y="177">• A quotation or purchase order</text><text class="s" x="257" y="193">under ₹1 lakh</text><text class="s" x="257" y="209">• A thank-you to a 4 or 5 star</text><text class="s" x="257" y="225">review, with no figures or</text><text class="s" x="257" y="241">promises</text><text class="s" x="257" y="257">• A post from a calendar you</text><text class="s" x="257" y="273">approved, unchanged and passing</text><text class="s" x="257" y="289">every check again</text>
  <rect class="none" x="245" y="322" width="245" height="71" rx="4"/><text class="t" x="257" y="345">Promotion offered</text><text class="s" x="257" y="362">After 300 decisions with 99.5%</text><text class="s" x="257" y="378">approved unchanged.</text>
  <rect class="box" x="520" y="40" width="190" height="135" rx="4"/><text class="t" x="532" y="63">Acts, and reports</text><text class="s" x="532" y="80">Everything goes ahead on</text><text class="s" x="532" y="96">its own and is logged,</text><text class="s" x="532" y="112">except the work that</text><text class="s" x="532" y="128">always waits. Social</text><text class="s" x="532" y="144">replies and posts keep</text><text class="s" x="532" y="160">the Trusted rules.</text>
  <rect class="desk" x="740" y="40" width="210" height="247" rx="4"/><text class="t" x="752" y="63">At every level</text><text class="s" x="752" y="80">• Bringing in your books</text><text class="s" x="752" y="96">• A new layout of sales</text><text class="s" x="752" y="112">report</text><text class="s" x="752" y="128">• A customer handed to you</text><text class="s" x="752" y="144">• Replies to your own email</text><text class="s" x="752" y="160">• Audit findings</text><text class="s" x="752" y="176">• Sharing files with your</text><text class="s" x="752" y="192">accountant</text><text class="s" x="752" y="208">• Compliance proposals</text><text class="s" x="752" y="224">• Campaigns, social</text><text class="s" x="752" y="240">calendars and WhatsApp</text><text class="s" x="752" y="256">broadcasts</text><text class="s" x="752" y="272">• Payroll runs</text>
  
</svg>
