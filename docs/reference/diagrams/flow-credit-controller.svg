<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 337" role="img" aria-labelledby="t-credit-controller">
  <title id="t-credit-controller">The Credit Controller: works out who is overdue each time you open the Desk and drafts a reminder of the right tone for each customer</title>
  <defs><marker id="a-credit-controller" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-credit-controller)}
  </style>
  <text class="hd" x="15" y="50">WHAT STARTS IT</text><text class="hd" x="215" y="50">WHAT IT DOES</text><text class="hd" x="525" y="50">ON YOUR DESK</text><text class="hd" x="760" y="50">WHAT HAPPENS NEXT</text><rect class="tag-works" x="842" y="10" width="106" height="24" rx="12"/><text class="tg" x="895" y="26" text-anchor="middle">Works today</text>
  <path class="ln" d="M185 86H200V86H213"/><path class="ln" d="M185 224H200V86H213"/><path class="ln" d="M243 149V163"/><path class="ln" d="M243 252V266"/><path class="ln" d="M495 292H510V86H523"/><path class="ln" d="M730 86H745V86H758"/><path class="ln" d="M730 86H745V223H758"/>
  <rect class="box" x="15" y="62" width="170" height="120" rx="4"/><text class="t" x="27" y="85">Your posted</text><text class="t" x="27" y="102">invoices</text><text class="s" x="27" y="119">Due dates from each</text><text class="s" x="27" y="135">customer's payment</text><text class="s" x="27" y="151">terms (30 days unless</text><text class="s" x="27" y="167">set)</text>
  <rect class="box" x="15" y="200" width="170" height="103" rx="4"/><text class="t" x="27" y="223">The morning round</text><text class="s" x="27" y="240">Retries reminders</text><text class="s" x="27" y="256">that could not be</text><text class="s" x="27" y="272">sent; Trusted sends</text><text class="s" x="27" y="288">polite ones</text>
  <rect class="box" x="215" y="62" width="280" height="87" rx="4"/><text class="t" x="227" y="85">1. Who is overdue</text><text class="s" x="227" y="102">Overdue invoices grouped by customer;</text><text class="s" x="227" y="118">customers owing under ₹10,000 in all</text><text class="s" x="227" y="134">are left alone</text>
  <rect class="box" x="215" y="165" width="280" height="87" rx="4"/><text class="t" x="227" y="188">2. Picks the tone</text><text class="s" x="227" y="205">From the oldest invoice: polite from</text><text class="s" x="227" y="221">1 day late, firm from 16 days, final</text><text class="s" x="227" y="237">from 46 days</text>
  <rect class="box" x="215" y="268" width="280" height="55" rx="4"/><text class="t" x="227" y="291">3. Writes the letter</text><text class="s" x="227" y="308">Listing each invoice and the total</text>
  <rect class="desk" x="525" y="62" width="205" height="137" rx="4"/><text class="t" x="537" y="85">"Send a reminder / a</text><text class="t" x="537" y="102">firm reminder / a final</text><text class="t" x="537" y="119">reminder to &lt;customer&gt;"</text><text class="s" x="537" y="136">Edit the subject and</text><text class="s" x="537" y="152">letter before approving.</text><text class="s" x="537" y="168">Trusted: polite first</text><text class="s" x="537" y="184">reminders go alone.</text>
  <rect class="done" x="760" y="62" width="185" height="119" rx="4"/><text class="t" x="772" y="85">Approve</text><text class="s" x="772" y="102">Emailed to the customer</text><text class="s" x="772" y="118">in your business's</text><text class="s" x="772" y="134">name, replies to you;</text><text class="s" x="772" y="150">tried again up to 3</text><text class="s" x="772" y="166">times if it fails</text>
  <rect class="stop" x="760" y="199" width="185" height="87" rx="4"/><text class="t" x="772" y="222">Reject</text><text class="s" x="772" y="239">Not sent; drafted again</text><text class="s" x="772" y="255">another day if still</text><text class="s" x="772" y="271">overdue</text>
  
</svg>
