<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 821" role="img" aria-labelledby="t-morning">
  <title id="t-morning">The morning round: at the digest time each hired agent does its morning work in a fixed order, then the digest goes to each owner by WhatsApp or email</title>
  <defs><marker id="a-morning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-morning)}
  </style>
  <text class="hd" x="10" y="28">WHEN</text><text class="hd" x="210" y="28">IN THIS ORDER</text><text class="hd" x="540" y="28">HOW IT REACHES YOU</text><text class="hd" x="770" y="28">THEN</text>
  <path class="ln" d="M180 64H195V64H208"/><path class="ln" d="M180 185H195V64H208"/><path class="ln" d="M238 127V135"/><path class="ln" d="M238 208V216"/><path class="ln" d="M238 305V313"/><path class="ln" d="M238 386V394"/><path class="ln" d="M238 483V491"/><path class="ln" d="M238 564V572"/><path class="ln" d="M238 645V653"/><path class="ln" d="M238 726V734"/><path class="ln" d="M510 760H525V64H538"/><path class="ln" d="M510 760H525V169H538"/><path class="ln" d="M510 760H525V258H538"/><path class="ln" d="M740 64H755V64H768"/>
  <rect class="box" x="10" y="40" width="170" height="103" rx="4"/><text class="t" x="22" y="63">The morning round</text><text class="s" x="22" y="80">Every morning at the</text><text class="s" x="22" y="96">digest time, 08:45</text><text class="s" x="22" y="112">unless you change it</text><text class="s" x="22" y="128">in Settings</text>
  <rect class="none" x="10" y="161" width="170" height="87" rx="4"/><text class="t" x="22" y="184">Run now</text><text class="s" x="22" y="201">Any routine can also</text><text class="s" x="22" y="217">be run from its room,</text><text class="s" x="22" y="233">or paused there.</text>
  <rect class="box" x="210" y="40" width="300" height="87" rx="4"/><text class="t" x="222" y="63">1. Trusted work</text><text class="s" x="222" y="80">Agents you have made Trusted or</text><text class="s" x="222" y="96">Autonomous finish the routine cards</text><text class="s" x="222" y="112">waiting</text>
  <rect class="box" x="210" y="137" width="300" height="71" rx="4"/><text class="t" x="222" y="160">2. Payment reminders</text><text class="s" x="222" y="177">Approved reminders that could not be</text><text class="s" x="222" y="193">sent are tried again</text>
  <rect class="box" x="210" y="218" width="300" height="87" rx="4"/><text class="t" x="222" y="241">3. Social media</text><text class="s" x="222" y="258">Comments and results fetched; posts due</text><text class="s" x="222" y="274">published; from the 25th, next month's</text><text class="s" x="222" y="290">calendar drafted</text>
  <rect class="box" x="210" y="315" width="300" height="71" rx="4"/><text class="t" x="222" y="338">4. Reorder check</text><text class="s" x="222" y="355">Purchase orders drafted for items at or</text><text class="s" x="222" y="371">under their reorder level</text>
  <rect class="box" x="210" y="396" width="300" height="87" rx="4"/><text class="t" x="222" y="419">5. Online sales</text><text class="s" x="222" y="436">The last day the marketplace reports</text><text class="s" x="222" y="452">cover, and products whose returns are</text><text class="s" x="222" y="468">climbing</text>
  <rect class="box" x="210" y="493" width="300" height="71" rx="4"/><text class="t" x="222" y="516">6. Filings due</text><text class="s" x="222" y="533">Reminders 7 days and 2 days before, on</text><text class="s" x="222" y="549">the day, and weekly while late</text>
  <rect class="box" x="210" y="574" width="300" height="71" rx="4"/><text class="t" x="222" y="597">7. Customers waiting</text><text class="s" x="222" y="614">Hand-offs waiting more than 4 hours;</text><text class="s" x="222" y="630">WhatsApp chats about to close</text>
  <rect class="box" x="210" y="655" width="300" height="71" rx="4"/><text class="t" x="222" y="678">8. Your agenda</text><text class="s" x="222" y="695">Each owner's next three days, for that</text><text class="s" x="222" y="711">owner only</text>
  <rect class="box" x="210" y="736" width="300" height="71" rx="4"/><text class="t" x="222" y="759">9. The digest</text><text class="s" x="222" y="776">What is waiting on your Desk, and what</text><text class="s" x="222" y="792">each routine did</text>
  <rect class="done" x="540" y="40" width="200" height="87" rx="4"/><text class="t" x="552" y="63">WhatsApp</text><text class="s" x="552" y="80">If you chose the digest</text><text class="s" x="552" y="96">and wrote to the office</text><text class="s" x="552" y="112">in the last 24 hours</text>
  <rect class="done" x="540" y="145" width="200" height="71" rx="4"/><text class="t" x="552" y="168">A WhatsApp template</text><text class="s" x="552" y="185">Otherwise, if one is set</text><text class="s" x="552" y="201">up</text>
  <rect class="done" x="540" y="234" width="200" height="55" rx="4"/><text class="t" x="552" y="257">Email</text><text class="s" x="552" y="274">Otherwise</text>
  <rect class="desk" x="770" y="40" width="180" height="167" rx="4"/><text class="t" x="782" y="63">Reply to decide</text><text class="s" x="782" y="80">"1 yes 2 no" or "all</text><text class="s" x="782" y="96">yes" on WhatsApp.</text><text class="s" x="782" y="112">Campaigns, calendars,</text><text class="s" x="782" y="128">broadcasts, posts,</text><text class="s" x="782" y="144">audit findings, file</text><text class="s" x="782" y="160">shares and payroll</text><text class="s" x="782" y="176">open on the Desk</text><text class="s" x="782" y="192">instead.</text>
  
</svg>
