<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 658" role="img" aria-labelledby="t-overview">
  <title id="t-overview">How work moves through your office: it comes in, the agent for that job drafts what should happen, you decide on your Desk, and the result goes into your books or out to the right person</title>
  <defs><marker id="a-overview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-overview)}
  </style>
  <text class="hd" x="20" y="28">WAYS IN</text><text class="hd" x="245" y="28">THE AGENTS</text><text class="hd" x="495" y="28">YOUR DESK</text><text class="hd" x="735" y="28">THE RESULT</text>
  <path class="ln" d="M215 64H230V64H243"/><path class="ln" d="M215 249H230V64H243"/><path class="ln" d="M215 354H230V64H243"/><path class="ln" d="M215 475H230V64H243"/><path class="ln" d="M215 581H230V64H243"/><path class="ln" d="M273 159V175"/><path class="ln" d="M273 296V312"/><path class="ln" d="M465 64H480V64H493"/><path class="ln" d="M523 175V191"/><path class="ln" d="M705 64H720V64H733"/><path class="ln" d="M705 64H720V169H733"/><path class="ln" d="M705 64H720V274H733"/><path class="ln" d="M705 217H720V379H733"/>
  <rect class="box" x="20" y="40" width="195" height="167" rx="4"/><text class="t" x="32" y="63">Email</text><text class="s" x="32" y="80">• Bills and invoices:</text><text class="s" x="32" y="96">your office's address</text><text class="s" x="32" y="112">• Marketplace reports:</text><text class="s" x="32" y="128">its .sales address</text><text class="s" x="32" y="144">• Your own email: its</text><text class="s" x="32" y="160">.assistant address</text><text class="s" x="32" y="176">• Customers: its .help</text><text class="s" x="32" y="192">address</text>
  <rect class="box" x="20" y="225" width="195" height="87" rx="4"/><text class="t" x="32" y="248">Upload in the app</text><text class="s" x="32" y="265">PDFs, photos, sales</text><text class="s" x="32" y="281">reports and the CSV files</text><text class="s" x="32" y="297">of your existing books</text>
  <rect class="box" x="20" y="330" width="195" height="103" rx="4"/><text class="t" x="32" y="353">WhatsApp</text><text class="s" x="32" y="370">The office's shared</text><text class="s" x="32" y="386">number for you and your</text><text class="s" x="32" y="402">people; your own business</text><text class="s" x="32" y="418">number for customers</text>
  <rect class="box" x="20" y="451" width="195" height="88" rx="4"/><text class="t" x="32" y="474">Instagram, Facebook,</text><text class="t" x="32" y="491">Threads</text><text class="s" x="32" y="508">Comments, reviews and</text><text class="s" x="32" y="524">messages</text>
  <rect class="box" x="20" y="557" width="195" height="87" rx="4"/><text class="t" x="32" y="580">The morning round</text><text class="s" x="32" y="597">Every morning at the</text><text class="s" x="32" y="613">digest time, 08:45 unless</text><text class="s" x="32" y="629">you change it in Settings</text>
  <rect class="box" x="245" y="40" width="220" height="119" rx="4"/><text class="t" x="257" y="63">The agent for that job</text><text class="s" x="257" y="80">Reads it, checks it against</text><text class="s" x="257" y="96">your books and drafts what</text><text class="s" x="257" y="112">should happen. Every amount</text><text class="s" x="257" y="128">and tax figure is worked out</text><text class="s" x="257" y="144">by code, never by AI.</text>
  <rect class="stop" x="245" y="177" width="220" height="119" rx="4"/><text class="t" x="257" y="200">From someone new?</text><text class="s" x="257" y="217">A document from a sender who</text><text class="s" x="257" y="233">is not in your books is</text><text class="s" x="257" y="249">never posted on its own, at</text><text class="s" x="257" y="265">any trust level: it waits</text><text class="s" x="257" y="281">for you.</text>
  <rect class="stop" x="245" y="314" width="220" height="87" rx="4"/><text class="t" x="257" y="337">Seen before?</text><text class="s" x="257" y="354">The same bill, invoice,</text><text class="s" x="257" y="370">proforma or report again is</text><text class="s" x="257" y="386">set aside without asking.</text>
  <rect class="desk" x="495" y="40" width="210" height="135" rx="4"/><text class="t" x="507" y="63">A card on your Desk</text><text class="s" x="507" y="80">Says exactly what will</text><text class="s" x="507" y="96">happen, with the page</text><text class="s" x="507" y="112">behind each figure.</text><text class="s" x="507" y="128">Approve, edit or reject: on</text><text class="s" x="507" y="144">the web, or by number on</text><text class="s" x="507" y="160">WhatsApp for most cards.</text>
  <rect class="none" x="495" y="193" width="210" height="87" rx="4"/><text class="t" x="507" y="216">Or done on its own</text><text class="s" x="507" y="233">Only routine work, and only</text><text class="s" x="507" y="249">for an agent you have made</text><text class="s" x="507" y="265">Trusted or Autonomous.</text>
  <rect class="done" x="735" y="40" width="205" height="87" rx="4"/><text class="t" x="747" y="63">Your books</text><text class="s" x="747" y="80">Posted bills and invoices</text><text class="s" x="747" y="96">feed GST, TDS, who owes</text><text class="s" x="747" y="112">you and the Boardroom.</text>
  <rect class="done" x="735" y="145" width="205" height="87" rx="4"/><text class="t" x="747" y="168">Sent out</text><text class="s" x="747" y="185">Payment reminders, replies</text><text class="s" x="747" y="201">to customers, posts and</text><text class="s" x="747" y="217">replies to your own email.</text>
  <rect class="done" x="735" y="250" width="205" height="87" rx="4"/><text class="t" x="747" y="273">Filed for the record</text><text class="s" x="747" y="290">Proformas, delivery notes</text><text class="s" x="747" y="306">and credit notes: kept,</text><text class="s" x="747" y="322">not posted.</text>
  <rect class="done" x="735" y="355" width="205" height="120" rx="4"/><text class="t" x="747" y="378">The team log and the</text><text class="t" x="747" y="395">digest</text><text class="s" x="747" y="412">Every action is written in</text><text class="s" x="747" y="428">the log; the morning</text><text class="s" x="747" y="444">digest tells you what</text><text class="s" x="747" y="460">happened.</text>
  
</svg>
