<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 383" role="img" aria-labelledby="t-auditor">
  <title id="t-auditor">The Auditor: when you bring in a filed return or GSTR-2B, compares it with the books and puts each difference on your Desk to raise with your accountant</title>
  <defs><marker id="a-auditor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-auditor)}
  </style>
  <text class="hd" x="15" y="50">WHAT STARTS IT</text><text class="hd" x="215" y="50">WHAT IT DOES</text><text class="hd" x="525" y="50">ON YOUR DESK</text><text class="hd" x="760" y="50">WHAT HAPPENS NEXT</text><rect class="tag-partly" x="834" y="10" width="114" height="24" rx="12"/><text class="tg" x="891" y="26" text-anchor="middle">Partly built</text>
  <path class="ln" d="M185 86H200V86H213"/><path class="ln" d="M243 133V147"/><path class="ln" d="M243 236V250"/><path class="ln" d="M495 276H510V86H523"/><path class="ln" d="M730 86H745V86H758"/><path class="ln" d="M730 86H745V175H758"/><path class="ln" d="M495 276H510V196H745V248H758"/>
  <rect class="box" x="15" y="62" width="170" height="104" rx="4"/><text class="t" x="27" y="85">Bring in a filed</text><text class="t" x="27" y="102">return</text><text class="s" x="27" y="119">GSTR-1, GSTR-3B or</text><text class="s" x="27" y="135">26Q as filed, or the</text><text class="s" x="27" y="151">GSTR-2B statement</text>
  <rect class="box" x="215" y="62" width="280" height="71" rx="4"/><text class="t" x="227" y="85">1. Compares with the books</text><text class="s" x="227" y="102">Each return against what the books</text><text class="s" x="227" y="118">say it should be</text>
  <rect class="box" x="215" y="149" width="280" height="87" rx="4"/><text class="t" x="227" y="172">2. Checks credit and TDS</text><text class="s" x="227" y="189">Input credit claimed for bills not in</text><text class="s" x="227" y="205">GSTR-2B; TDS customers deducted that</text><text class="s" x="227" y="221">is missing from Form 26AS</text>
  <rect class="box" x="215" y="252" width="280" height="55" rx="4"/><text class="t" x="227" y="275">3. Explains each difference</text><text class="s" x="227" y="292">With the documents on both sides</text>
  <rect class="desk" x="525" y="62" width="205" height="120" rx="4"/><text class="t" x="537" y="85">"Raise with &lt;firm&gt;:</text><text class="t" x="537" y="102">&lt;finding&gt;"</text><text class="s" x="537" y="119">One card per finding.</text><text class="s" x="537" y="135">Always waits; your</text><text class="s" x="537" y="151">accountant can decide it</text><text class="s" x="537" y="167">too.</text>
  <rect class="done" x="760" y="62" width="185" height="71" rx="4"/><text class="t" x="772" y="85">Approve</text><text class="s" x="772" y="102">Recorded as raised in</text><text class="s" x="772" y="118">the log</text>
  <rect class="stop" x="760" y="151" width="185" height="55" rx="4"/><text class="t" x="772" y="174">Reject</text><text class="s" x="772" y="191">Dismissed</text>
  <rect class="done" x="760" y="224" width="185" height="71" rx="4"/><text class="t" x="772" y="247">The Audit screen</text><text class="s" x="772" y="264">Every finding with its</text><text class="s" x="772" y="280">working</text>
  <rect class="nyet" x="15" y="333" width="930" height="36" rx="4"/><text class="ny" x="27" y="355">Not yet: checking anything before a return is brought in; raising a finding contacts no one yet.</text>
</svg>
