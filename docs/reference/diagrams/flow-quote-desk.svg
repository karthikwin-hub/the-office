<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 242" role="img" aria-labelledby="t-quote-desk">
  <title id="t-quote-desk">The Quote Desk: shows your quotations and which customers are overdue</title>
  <defs><marker id="a-quote-desk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27408B"/></marker></defs>
  <style>
    .box{fill:#fff;stroke:#2A2D31;stroke-width:1.3}
    .desk{fill:#E8ECF6;stroke:#27408B;stroke-width:1.6}
    .done{fill:#EEF4EE;stroke:#3C6E47;stroke-width:1.3}
    .stop{fill:#F7F1EC;stroke:#8A5A2B;stroke-width:1.3}
    .none{fill:#fafafa;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .nyet{fill:#fbfaf7;stroke:#9AA1AB;stroke-width:1.2;stroke-dasharray:5 4}
    .t{font-size:13.5px;fill:#2A2D31;font-weight:700}
    .s{font-size:12px;fill:#4A5260}
    .ny{font-size:12px;fill:#5A6270;font-style:italic}
    .hd{font-size:11px;fill:#5A6270;font-weight:700;letter-spacing:.08em}
    .tg{font-size:12px;font-weight:700;fill:#fff}
    .tag-works{fill:#3C6E47}
    .tag-reports{fill:#5A6270}
    .tag-partly{fill:#8A5A2B}
    .ln{stroke:#27408B;stroke-width:1.4;fill:none;marker-end:url(#a-quote-desk)}
  </style>
  <text class="hd" x="15" y="50">WHAT STARTS IT</text><text class="hd" x="215" y="50">WHAT IT DOES</text><text class="hd" x="525" y="50">ON YOUR DESK</text><text class="hd" x="760" y="50">WHAT HAPPENS NEXT</text><rect class="tag-reports" x="834" y="10" width="114" height="24" rx="12"/><text class="tg" x="891" y="26" text-anchor="middle">Reports only</text>
  <path class="ln" d="M185 86H200V86H213"/><path class="ln" d="M495 86H510V86H523"/><path class="ln" d="M730 86H745V86H758"/>
  <rect class="box" x="15" y="62" width="170" height="104" rx="4"/><text class="t" x="27" y="85">A WhatsApp voice</text><text class="t" x="27" y="102">note</text><text class="s" x="27" y="119">Asking for a quote</text><text class="s" x="27" y="135">becomes a lead marked</text><text class="s" x="27" y="151">"Draft the quotation"</text>
  <rect class="box" x="215" y="62" width="280" height="71" rx="4"/><text class="t" x="227" y="85">1. Lists your quotations</text><text class="s" x="227" y="102">With customers more than 60 days</text><text class="s" x="227" y="118">overdue marked</text>
  <rect class="none" x="525" y="62" width="205" height="87" rx="4"/><text class="t" x="537" y="85">Nothing on your Desk</text><text class="s" x="537" y="102">Nothing in the real flow;</text><text class="s" x="537" y="118">the demo shows a sample</text><text class="s" x="537" y="134">card.</text>
  <rect class="done" x="760" y="62" width="185" height="88" rx="4"/><text class="t" x="772" y="85">Boardroom →</text><text class="t" x="772" y="102">Quotations</text><text class="s" x="772" y="119">Open, sent and accepted</text><text class="s" x="772" y="135">quotations</text>
  <rect class="nyet" x="15" y="192" width="930" height="36" rx="4"/><text class="ny" x="27" y="214">Not yet: drafting quotations from your price list; discounts within your limits; sending a quotation when you approve it.</text>
</svg>
