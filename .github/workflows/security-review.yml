name: Security review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # the review comments on the pull request

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude security review
    # The Action is not hardened against prompt injection, and forks get no secrets: review only branches pushed to
    # this repository, and skip Renovate's dependency bumps (lockfile diffs, already covered by the audit job).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: 'echo "::notice::Skipped: add the ANTHROPIC_API_KEY repository secret to turn on the security review."'
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      # No releases are tagged; this is main on 11 February 2026. Update on purpose, after reading the change.
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          comment-pr: true
          false-positive-filtering-instructions: docs/security/false-positive-filtering.txt
          exclude-directories: docs/reference,packages/fixtures/data,packages/fixtures/test/fixtures
